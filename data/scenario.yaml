# The first-version star system. Made-up star.
# See docs/game-design.md. Starting values are untuned.

name: Arden's Star
star: { name: Arden, massSolar: 0.9, radiusKm: 600000 }

planets:
  - { name: Cinder, orbitAu: 0.45, inclinationDeg: 2, phaseDeg: 40, massEarth: 0.3, radiusKm: 3000 }
  - { name: Haven, orbitAu: 1.0, inclinationDeg: 0, phaseDeg: 120, massEarth: 1.2, radiusKm: 6800 }
  - { name: Shale, orbitAu: 1.7, inclinationDeg: 4, phaseDeg: 250, massEarth: 15, radiusKm: 25000 }

# The ship arrives at bearingDeg [azimuth, elevation] from the star (where it came from).
entry: { radiusAu: 1.3, bearingDeg: [0, 5], minSpeedKmS: 20, maxSpeedKmS: 300, defaultSpeedKmS: 80 }

player: { name: Neumann, design: probe }

# Each enemy starts in a circular orbit of `orbits` (a planet or the star) at
# offsetKm from its centre.
enemies:
  - { name: Haven Base, design: base, orbits: Haven, offsetKm: [40000, 0, 0] }
  - { name: Haven Platform, design: defencePlatform, orbits: Haven, offsetKm: [-40000, 0, 5000] }
  - { name: Raider 1, design: raider, orbits: Haven, offsetKm: [0, 150000, 0] }
  - { name: Raider 2, design: raider, orbits: Haven, offsetKm: [0, -150000, 0] }
  - { name: Raider 3, design: raider, orbits: Cinder, offsetKm: [0, 80000, 0], ambush: true, ambushRangeKm: 2000000 }
  - { name: Raider 4, design: raider, orbits: Arden, offsetKm: [0, -180000000, 0] }
