# Simulation, auto-pause, and AI settings.
# See docs/game-design.md. Starting values are untuned.

sim:
  baseStepSeconds: 10          # normal simulation step
  fineStepSeconds: 0.5         # shortest step, used near impacts
  fineStepDivisions: 10        # step ≈ projectile time-to-target / this
  historySampleSeconds: 10     # how often positions are recorded for light delay
  historyKeepSeconds: 21600    # how far back positions are kept
  slugLifetimeSeconds: 21600
  torpedoLifetimeSeconds: 43200
  seed: 1

ships:
  jinkIntervalSeconds: 20         # evasive manoeuvres pick a new sideways direction this often
  slugAlertKm: 1                  # a detected slug passing this close raises slug inbound
  alignToleranceDeg: 2          # a burn thrusts once the front is this close to its direction
  turnFuelKgPerTonneDeg: 0.0005 # turning fuel: kg per tonne of ship per degree

autoPause:
  lowSupplyFraction: 0.25
  repeatSuppressionSeconds: 600
  groupSeconds: 60             # same-kind events this soon after a pause are part of it
  pauseOn:
    - NEW_CONTACT
    - TORPEDO_INBOUND
    - SLUG_INBOUND
    - ENTERED_WEAPON_RANGE
    - DAMAGE_TAKEN
    - DESTROYED
    - LOW_FUEL
    - LOW_AMMO
    - SYSTEM_CLAIMED
    - SHIP_LOST

ai:
  jinkRangeKm: 30000           # ships with thrusters jink while a hostile ship is this close
  standoffKm: 2000             # enemy ships try to hold this distance
  combatDvKmS: 0.5             # inside weapon range, burn only for course errors bigger than this
  maxClosingSpeedKmS: 10
