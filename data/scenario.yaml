# The first-version star system. Made-up star.
# See docs/game-design.md. Starting values are untuned.

name: Arden's Star
star: { name: Arden, massSolar: 0.9, radiusKm: 600000 }

planets:
  - { name: Cinder, orbitAu: 0.45, inclinationDeg: 2, phaseDeg: 40, massEarth: 0.3, radiusKm: 3000 }
  - { name: Haven, orbitAu: 1.0, inclinationDeg: 0, phaseDeg: 120, massEarth: 1.2, radiusKm: 6800 }
  - { name: Shale, orbitAu: 1.7, inclinationDeg: 4, phaseDeg: 250, massEarth: 15, radiusKm: 25000 }

entry: { radiusAu: 1.3, minSpeedKmS: 20, maxSpeedKmS: 300, defaultSpeedKmS: 80 }

player: { name: Neumann, design: probe }

# offsetKm is from the planet's centre. Fixed defences and bases hold station
# there; ships start in a circular orbit of the planet at that offset.
enemies:
  - { name: Haven Base, design: base, planet: Haven, offsetKm: [40000, 0, 0] }
  - { name: Haven Platform, design: defencePlatform, planet: Haven, offsetKm: [-40000, 0, 5000] }
  - { name: Picket, design: frigate, planet: Haven, offsetKm: [0, 150000, 0] }
  - { name: Lurker, design: frigate, planet: Cinder, offsetKm: [0, 80000, 0], ambush: true, ambushRangeKm: 2000000 }
