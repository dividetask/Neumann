# Module types and munitions. See docs/ships.md, docs/weapons.md,
# docs/sensors.md; the numbers follow docs/tech-level.md.
# Every module: cost (resources), massT (tonnes), buildHours,
# hitPoints (1 hit point = 1 MJ).

modules:
  # --- Hulls (300 MJ of hit points per tonne) ----------------------------
  probeHull:
    { name: Probe hull, kind: HULL, cost: 200, massT: 60, buildHours: 48, hitPoints: 18000 }
  raiderHull:
    { name: Raider hull, kind: HULL, cost: 60, massT: 30, buildHours: 16, hitPoints: 9000 }
  platformHull:
    { name: Platform hull, kind: HULL, cost: 80, massT: 50, buildHours: 24, hitPoints: 15000 }
  baseHull:
    { name: Base hull, kind: HULL, cost: 400, massT: 400, buildHours: 120, hitPoints: 120000 }

  # --- Propulsion ----------------------------------------------------------
  # thrust = 2 x jet power / exhaust speed; fuel use = thrust / exhaust speed.
  # Ship turn rate (deg/s) = total turnAuthority / ship mass in tonnes.
  fusionDrive:
    name: Fusion drive               # 4 GW jet power, 300 km/s exhaust
    kind: PROPULSION
    cost: 150
    massT: 40
    buildHours: 36
    hitPoints: 2000
    propulsion: { thrustKN: 26.7, fuelKgS: 0.089, turnAuthority: 300 }
  plasmaDrive:
    name: Plasma drive               # 1 GW jet power, 200 km/s exhaust
    kind: PROPULSION
    cost: 80
    massT: 15
    buildHours: 20
    hitPoints: 1000
    propulsion: { thrustKN: 10, fuelKgS: 0.05, turnAuthority: 300 }
  manoeuvringThrusters:
    name: Manoeuvring thrusters      # 40 MW, 40 km/s exhaust
    kind: PROPULSION
    cost: 30
    massT: 3
    buildHours: 8
    hitPoints: 300
    propulsion: { thrustKN: 2, fuelKgS: 0.05, turnAuthority: 600 }

  # --- Power ---------------------------------------------------------------
  reactor:
    name: Electrical engine          # fusion reactor, ~5 MW per tonne
    kind: GENERATOR
    cost: 120
    massT: 20
    buildHours: 30
    hitPoints: 1000
    generator: { powerMW: 100 }
  smallReactor:
    name: Small electrical engine
    kind: GENERATOR
    cost: 50
    massT: 8
    buildHours: 14
    hitPoints: 500
    generator: { powerMW: 40 }
  battery:
    name: Battery                    # ~2 MJ per kg
    kind: BATTERY
    cost: 40
    massT: 5
    buildHours: 10
    hitPoints: 300
    battery: { capacityMJ: 10000 }

  # --- Storage -------------------------------------------------------------
  fuelTank:
    name: Fuel tank                  # D-He3 fuel and hydrogen reaction mass
    kind: FUEL_TANK
    cost: 20
    massT: 3
    buildHours: 6
    hitPoints: 500
    fuelTank: { capacityT: 20 }
  ammoContainer:
    name: Ammo container
    kind: AMMO_CONTAINER
    cost: 10
    massT: 1
    buildHours: 4
    hitPoints: 300
    ammoContainer: { capacity: 200 }

  # --- Sensors (see docs/sensors.md) --------------------------------------
  # Errors are 1 sigma. Radar range is for a 100 m target.
  telescope:
    name: Telescope
    kind: SENSOR
    cost: 60
    massT: 3
    buildHours: 16
    hitPoints: 200
    sensor: { type: TELESCOPE, rangeAu: 1.0, bearingErrorDeg: 0.0005, rangeErrorFraction: 0.2, velocityErrorKmS: 0.5, powerMW: 0.1 }
  radar:
    name: Radar
    kind: SENSOR
    cost: 80
    massT: 6
    buildHours: 20
    hitPoints: 300
    sensor: { type: RADAR, rangeAu: 0.01, bearingErrorDeg: 0.05, rangeErrorFraction: 0.002, velocityErrorKmS: 0.02, powerMW: 10 }
  lidar:
    name: Lidar
    kind: SENSOR
    cost: 70
    massT: 3
    buildHours: 18
    hitPoints: 200
    sensor: { type: LIDAR, rangeAu: 0.007, bearingErrorDeg: 0.0001, rangeErrorFraction: 0.00001, velocityErrorKmS: 0.0001, powerMW: 2 }
  emissionReceiver:
    name: Emission receiver
    kind: SENSOR
    cost: 30
    massT: 1
    buildHours: 8
    hitPoints: 100
    sensor: { type: EMISSION_RECEIVER, rangeAu: 3.0, bearingErrorDeg: 0.1, rangeErrorFraction: 1.0, velocityErrorKmS: 1.0, powerMW: 0.05 }

  # --- Weapons -------------------------------------------------------------
  # arcDeg: largest angle from the ship's front the weapon can fire at.
  # Lasers: beamMW = damage per second at full focus; powerMW = draw (~50% efficient).
  laserTurret:
    name: Laser turret
    kind: LASER_TURRET
    cost: 100
    massT: 10
    buildHours: 24
    hitPoints: 600
    laser: { rangeKm: 50000, focusRangeKm: 5000, beamMW: 15, powerMW: 30, burstSeconds: 60, arcDeg: 150 }
  lightLaserTurret:
    name: Light laser turret
    kind: LASER_TURRET
    cost: 50
    massT: 5
    buildHours: 12
    hitPoints: 300
    laser: { rangeKm: 50000, focusRangeKm: 5000, beamMW: 14, powerMW: 28, burstSeconds: 60, arcDeg: 150 }
  heavyLaserTurret:
    name: Heavy laser turret
    kind: LASER_TURRET
    cost: 180
    massT: 20
    buildHours: 40
    hitPoints: 1000
    laser: { rangeKm: 80000, focusRangeKm: 8000, beamMW: 60, powerMW: 120, burstSeconds: 60, arcDeg: 150 }
  # Coilguns. shotEnergyMJ ~ 2 x muzzle energy of a 2 kg slug.
  cannon:
    name: Cannon
    kind: CANNON
    cost: 80
    massT: 12
    buildHours: 20
    hitPoints: 600
    cannon: { muzzleSpeedKmS: 20, shotEnergyMJ: 800, cooldownSeconds: 30, autoRangeKm: 5000, arcDeg: 10 }
  lightCannon:
    name: Light cannon
    kind: CANNON
    cost: 40
    massT: 6
    buildHours: 12
    hitPoints: 300
    cannon: { muzzleSpeedKmS: 10, shotEnergyMJ: 200, cooldownSeconds: 30, autoRangeKm: 3000, arcDeg: 10 }
  cannonTurret:
    name: Cannon turret
    kind: CANNON
    cost: 120
    massT: 15
    buildHours: 30
    hitPoints: 800
    cannon: { muzzleSpeedKmS: 15, shotEnergyMJ: 450, cooldownSeconds: 20, autoRangeKm: 5000, arcDeg: 150 }
  missileBay:
    name: Missile bay
    kind: MISSILE_BAY
    cost: 60
    massT: 6
    buildHours: 16
    hitPoints: 500
    missileBay: { capacity: 6, cooldownSeconds: 60, launchRangeKm: 100000, arcDeg: 180 }
  smallMissileBay:
    name: Small missile bay
    kind: MISSILE_BAY
    cost: 30
    massT: 3
    buildHours: 8
    hitPoints: 300
    missileBay: { capacity: 4, cooldownSeconds: 20, launchRangeKm: 100000, arcDeg: 180 }

munitions:
  slug: { massKg: 2, cost: 0.5, buildHours: 0.1 }   # damage = kinetic energy at impact
  torpedo:                           # nuclear-thermal motor, fragmentation warhead
    launchSpeedKmS: 0.05
    accelerationMS2: 50
    deltaVKmS: 15
    terminalReserveFraction: 0.25   # delta-v kept for steering on the final approach
    sizeM: 5
    hitPoints: 100
    damage: 2000
    blastRadiusKm: 1
    signature: 0.1
    burningSignature: 3.0
    massKg: 500
    cost: 20
    buildHours: 6
